services:
  - type: web
    name: lorrey-ai-worker
    env: python
    rootDir: ai-worker
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn pipeline:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: OPENAI_API_KEY
        sync: false
