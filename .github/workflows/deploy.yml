name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            echo "Starting deployment on EC2..."
            
            # 1. Load Node, npm, and PM2 into PATH for non-interactive SSH
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:~/.nvm/versions/node/$(ls ~/.nvm/versions/node 2>/dev/null | tail -n 1)/bin

            # Log versions for verification
            node -v
            npm -v

            # 2. Pull latest code
            cd ~/lorrey-project
            git fetch origin main
            git reset --hard origin/main

            # 3. Build and update Frontend
            cd ~/lorrey-project/frontend/review-dashboard/UI2
            npm install
            rm -rf dist
            npm run build
            sudo rm -rf /var/www/lorrey/* 2>/dev/null || true
            sudo cp -r dist/* /var/www/lorrey/
            sudo chown -R www-data:www-data /var/www/lorrey

            # 4. Update and restart Backend
            cd ~/lorrey-project/backend-node
            npm install
            pm2 restart all --update-env

            echo "Deployment completed successfully!"
